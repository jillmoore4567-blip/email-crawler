# Default crawler configuration.
# CLI arguments override values from this file.
seeds: data/seeds.txt
max_pages: 100
max_depth: 2
concurrency: 20
thread_pool_workers: 8
timeout: 12.0
delay: 0.0
retries: 1
retry_statuses: "429,500,502,503,504"
retry_backoff_base: 0.5
retry_backoff_max: 8.0
user_agent: EmailCrawlerBot/1.0 (+https://example.local)
rate_limit: 0.0
ignore_robots: false
collect_robots: true
collect_sitemap: true
collect_security_txt: true
collect_feeds: true
collect_contact_pages: true
collect_whois: true
collect_tls: true
collect_security_headers: true
collect_tech_fingerprint: true
collect_javascript_assets: true
collect_subdomains: true
collect_screenshots: false
screenshot_dir: output/screenshots
collect_broken_links: true
broken_links_max_checks_per_page: 40
broken_links_same_domain_only: true
max_links_per_page_saved: 200
max_discovered_links_per_seed: 10000
checkpoint_dir: output/checkpoints
resume: false
incremental: false
checkpoint_every_pages: 10
cross_domain: false
allow_domain: []
out_emails: output/emails.txt
out_json: output/results.json
out_csv: output/results.csv
out_stats: output/stats.json
out_snapshot_diff: output/snapshot_diff.json
out_sqlite: output/findings.db
out_html: output/report.html
log_level: INFO
log_file: output/crawler.log
