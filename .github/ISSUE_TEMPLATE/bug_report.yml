name: Bug report
description: Report a reproducible defect in email-crawler
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please include enough detail for us to reproduce and verify quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the problem
      placeholder: CLI fails when running with --incremental and --resume
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, package version
      placeholder: |
        OS: Windows 11
        Python: 3.12
        Install: pip install email-crawler==1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps
      placeholder: |
        1. Run command...
        2. Use this config...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and traceback
      description: Paste relevant output from terminal/log files
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I can reproduce this on the latest main branch or latest release.
          required: true
        - label: I removed secrets and sensitive data from logs/output.
          required: true
