[mypy]
python_version = 3.12
pretty = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
disallow_untyped_defs = True

# Stage 1 strict rollout: core runtime and migration/docs tests.
files = src/email_crawler/crawler.py, src/email_crawler/storage.py, src/email_crawler/io_utils.py, src/email_crawler/reporting.py, src/email_crawler/cli.py, tests/test_storage_history.py, tests/test_docs_sync.py

[mypy-yaml]
ignore_missing_imports = True
